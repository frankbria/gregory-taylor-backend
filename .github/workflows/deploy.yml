name: CI/CD Pipeline

# CI only. Production lives on a Tailscale-only host that GitHub runners cannot
# reach, so deploys run from a tailnet machine (see README deployment section).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
        env:
          # Dummy values; server env is read at runtime, not baked into the build
          MONGODB_URI: mongodb://localhost:27017/test
          BETTER_AUTH_SECRET: build-time-dummy-secret-32chars
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_dummy
          CLOUDINARY_CLOUD_NAME: dummy
          CLOUDINARY_API_KEY: dummy
          CLOUDINARY_API_SECRET: dummy
          CORS_ALLOWED_ORIGINS: http://localhost:3000
